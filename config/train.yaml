seed: 42
cuda: True
cuda_deterministic: True
exp_name: responsive_steer_gear_400
track_exp: False
capture_video: False

env:
  num_envs: 8 # Number of envs for training
  num_checkpoints: 10
  lap_completion_reward: 1000
  max_env_step: 500
  checkpoint_bonus_step: 150
  max_throttle: 0.5
  vel_penalty_weight: 0.5 # Weight for velocity penalty in the reward function
  steer_penalty_weight: 0.5 # Weight for steering penalty in the reward function
  domain_randomization: False # Whether to apply domain randomization during training
  track_idx: 4 # Index of the track to use for training (if None, a random track will be selected each episode)

curriculum:
  - name: fixed_easy_track
    start_timestep: 0
    end_timestep: 250000
    track_mode: fixed
    track_indices: [4]
    domain_randomization: false
    max_throttle: 0.4
    max_env_step: 500
    checkpoint_bonus_step: 150
    num_checkpoints: 10
  - name: known_tracks_moderate
    start_timestep: 250000
    end_timestep: 700000
    track_mode: cycle
    track_indices: [1, 3, 4]
    domain_randomization: false
    max_throttle: 1.0
    max_env_step: 700
    checkpoint_bonus_step: 200
    num_checkpoints: 12
  - name: random_tracks_dr
    start_timestep: 700000
    end_timestep: null
    track_mode: random
    track_indices: null
    domain_randomization: true
    max_throttle: 2.5
    max_env_step: 900
    checkpoint_bonus_step: 250
    num_checkpoints: 14

wandb:
  project: mujoco-racing-ads-dv
  mode: offline # online

ppo:
  total_timesteps: 1_000_000
  batchsize: 256
  n_steps: 2048
