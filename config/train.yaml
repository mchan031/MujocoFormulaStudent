seed: 42
cuda: True
cuda_deterministic: True
exp_name: responsive_steer_gear_400_distance_resume
track_exp: False
capture_video: False

env:
  num_envs: 16 # Number of envs for training
  num_checkpoints: 50
  lap_completion_reward: 1000
  max_env_step: 3000
  # checkpoint_bonus_step: 300
  stuck_patience: 200 # Number of steps to wait before considering the agent stuck
  # max_throttle: 1.0
  vel_penalty_weight: 0.01 # Weight for velocity penalty in the reward function
  steer_penalty_weight: 0.01 # Weight for steering penalty in the reward function
  domain_randomization: False # Whether to apply domain randomization during training
  track_idx: 0 # Index of the track to use for training (if None, a random track will be selected each episode)

wandb:
  project: mujoco-racing-ads-dv
  mode: offline # online
  
ppo:
  total_timesteps: 1_000_000
  batchsize: 256
  n_steps: 1024 
