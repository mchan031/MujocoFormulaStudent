seed: 42
cuda: False
cuda_deterministic: True
exp_name: testing
track_exp: False
capture_video: False

env:
  num_envs: 4 # Number of drones for training
  num_checkpoints: 10
  lap_completion_reward: 1000
  max_env_step: 1500
  checkpoint_bonus_step: 250
  max_throttle: 2.5
  random_track_mode: True # Whether to randomize track selection during training
  vel_penalty_weight: 0.5 # Weight for velocity penalty in the reward function
  steer_penalty_weight: 0.5 # Weight for steering penalty in the reward function

wandb:
  project: mujoco-racing
  mode: offline # online
  
ppo:
  total_timesteps: 1_000_000
  batchsize: 256
  n_steps: 2048